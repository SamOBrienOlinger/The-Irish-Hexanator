name: UI regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, design/modern-hexanator-ui-2026]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test-only dependencies
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run browser and feature-parity checks
        run: python tests/ui_regression.py
      - name: Save source snapshot for visual review
        if: always()
        run: |
          mkdir -p test-results
          git archive --format=zip HEAD > test-results/tested-source.zip
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-regression-evidence
          path: test-results/
          retention-days: 7
